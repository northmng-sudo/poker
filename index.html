<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Нөхдийн покер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --felt-1:#173c30;
    --felt-2:#0b2018;
    --rail:#4a3324;
    --rail-2:#2e1f16;
    --brass:#c9a227;
    --brass-dim:#9c7f34;
    --cream:#f6f1e4;
    --ink:#211c15;
    --muted:#a9c2b1;
    --muted-dim:#6f8b7a;
    --red:#c1463a;
    --danger:#c1463a;
    --panel:#0f2a21;
    --panel-line:rgba(201,162,39,0.25);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Space Grotesk', 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--felt-2);}
  body{
    font-family:var(--font-body);
    color:var(--cream);
    background:
      radial-gradient(ellipse at 50% 38%, var(--felt-1) 0%, var(--felt-2) 72%),
      linear-gradient(180deg, #0a1c15, #0a1c15);
    min-height:100vh;
    overflow-x:hidden;
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  ::selection{background:var(--brass); color:var(--ink);}

  /* ---------- Landing ---------- */
  .landing{flex:1; display:flex; align-items:center; justify-content:center; padding:24px;}
  .landing-card{
    width:100%; max-width:420px;
    background:linear-gradient(180deg, rgba(23,60,48,0.6), rgba(11,32,24,0.6));
    border:1px solid var(--panel-line);
    border-radius:18px;
    padding:36px 30px 30px;
    box-shadow:0 30px 60px rgba(0,0,0,0.45);
  }
  .brand{text-align:center; margin-bottom:28px;}
  .brand .glyphs{font-size:26px; letter-spacing:6px; color:var(--brass); margin-bottom:6px;}
  .brand h1{
    font-family:var(--font-display); font-weight:600; font-size:34px; margin:0;
    color:var(--cream); letter-spacing:0.3px;
  }
  .brand p{color:var(--muted); font-size:14px; margin:8px 0 0; line-height:1.5;}
  label{display:block; font-size:13px; color:var(--muted); margin:18px 0 6px;}
  .field{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(201,162,39,0.3);
    background:rgba(0,0,0,0.25); color:var(--cream); font-size:16px; outline:none;
  }
  .field:focus{border-color:var(--brass);}
  .field.code{text-transform:uppercase; letter-spacing:4px; text-align:center; font-family:var(--font-body); font-weight:600;}
  .row-split{display:flex; gap:10px;}
  .row-split .field{flex:1;}
  .btn{
    border:none; border-radius:10px; padding:13px 18px; font-size:15px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform 0.08s ease, filter 0.15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--brass); color:#241c08;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; color:var(--cream); border:1px solid rgba(246,241,228,0.25);}
  .btn-ghost:hover{border-color:var(--brass); color:var(--brass);}
  .btn-danger{background:transparent; color:var(--red); border:1px solid rgba(193,70,58,0.5);}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}
  .btn-block{width:100%; margin-top:22px;}
  .divider-or{
    display:flex; align-items:center; gap:12px; margin:24px 0 4px; color:var(--muted-dim); font-size:12px;
  }
  .divider-or::before, .divider-or::after{content:""; flex:1; height:1px; background:rgba(201,162,39,0.2);}
  .adv-toggle{
    margin-top:18px; font-size:13px; color:var(--muted-dim); cursor:pointer; text-align:center;
    text-decoration:underline; text-underline-offset:3px;
  }
  .adv-panel{margin-top:6px; display:none;}
  .adv-panel.open{display:block;}
  .error-msg{
    margin-top:14px; padding:10px 12px; border-radius:8px; background:rgba(193,70,58,0.15);
    border:1px solid rgba(193,70,58,0.4); color:#f0b3ab; font-size:13px;
  }

  /* ---------- Room header ---------- */
  .room-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 16px; background:rgba(10,25,19,0.7); border-bottom:1px solid var(--panel-line);
  }
  .code-chip{
    display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.25);
    border:1px solid var(--brass-dim); border-radius:20px; padding:6px 12px; font-size:13px;
  }
  .code-chip b{color:var(--brass); letter-spacing:3px; font-size:15px;}
  .code-chip button{background:none; border:none; color:var(--muted); font-size:12px; padding:2px 4px;}
  .code-chip button:hover{color:var(--brass);}
  .hdr-actions{display:flex; gap:8px; align-items:center;}
  .icon-btn{
    background:rgba(0,0,0,0.2); border:1px solid rgba(246,241,228,0.15); color:var(--cream);
    border-radius:8px; padding:8px 10px; font-size:13px;
  }
  .icon-btn:hover{border-color:var(--brass); color:var(--brass);}

  /* ---------- Table ---------- */
  .table-wrap{flex:1; position:relative; padding:10px; display:flex; flex-direction:column;}
  .table-oval-holder{flex:1; position:relative; min-height:420px;}
  .table-oval{
    position:absolute; inset:8%;
    background:
      radial-gradient(ellipse at 50% 40%, var(--felt-1) 0%, #0e2a21 78%);
    border-radius:50%;
    border:14px solid var(--rail);
    box-shadow:
      inset 0 0 0 2px rgba(201,162,39,0.35),
      inset 0 30px 60px rgba(0,0,0,0.4),
      0 20px 40px rgba(0,0,0,0.5);
  }
  .table-center{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; width:70%;
  }
  .community{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; min-height:64px; align-items:center;}
  .pot-line{margin-top:10px; font-size:13px; color:var(--muted);}
  .pot-line b{color:var(--brass); font-family:var(--font-body); font-size:16px;}
  .stage-line{font-size:11px; color:var(--muted-dim); margin-top:2px; letter-spacing:0.5px;}

  .card{
    width:38px; height:54px; border-radius:6px; background:var(--cream);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:var(--font-body); font-weight:700; font-size:15px; color:var(--ink);
    box-shadow:0 3px 6px rgba(0,0,0,0.4); line-height:1;
    border:1px solid rgba(0,0,0,0.08);
  }
  .card.red{color:var(--red);}
  .card .suit{font-size:15px; margin-top:1px;}
  .card.back{
    background:repeating-linear-gradient(135deg, #3a2716, #3a2716 4px, #4a3320 4px, #4a3320 8px);
    border:1px solid rgba(201,162,39,0.5);
  }
  .card.small{width:30px; height:43px; font-size:12px;}
  .card.small .suit{font-size:12px;}
  .card.tiny{width:24px; height:34px; font-size:10px; border-radius:4px;}
  .card.tiny .suit{font-size:10px;}

  .seat{
    position:absolute; width:118px; margin-left:-59px; margin-top:-40px;
    text-align:center;
  }
  .seat-plaque{
    background:rgba(9,22,17,0.88); border:1px solid var(--panel-line); border-radius:12px;
    padding:6px 8px 8px; position:relative;
  }
  .seat.me .seat-plaque{border-color:var(--brass);}
  .seat.turn .seat-plaque{border-color:var(--brass); box-shadow:0 0 0 2px rgba(201,162,39,0.5), 0 0 18px rgba(201,162,39,0.35);}
  .seat.folded .seat-plaque{opacity:0.4;}
  .seat-name{font-size:12px; font-weight:600; color:var(--cream); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .seat-chips{font-size:12px; color:var(--brass); margin-top:2px;}
  .seat-hole{display:flex; gap:3px; justify-content:center; margin-top:5px;}
  .seat-tag{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    font-size:9px; background:var(--brass); color:#241c08; padding:1px 6px; border-radius:8px; font-weight:700;
  }
  .seat-bet{
    margin-top:4px; font-size:11px; color:var(--muted);
    background:rgba(0,0,0,0.3); display:inline-block; padding:1px 7px; border-radius:8px;
  }

  /* ---------- Action bar ---------- */
  .action-bar{
    background:rgba(8,20,15,0.92); border-top:1px solid var(--panel-line);
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  }
  .my-hand-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .my-hand-row .cards{display:flex; gap:5px;}
  .my-hand-info{font-size:12px; color:var(--muted);}
  .my-hand-info b{color:var(--cream); display:block; font-size:13px;}
  .actions-row{display:flex; gap:8px; flex-wrap:wrap;}
  .actions-row .btn{flex:1; min-width:84px;}
  .raise-panel{margin-top:10px; display:none;}
  .raise-panel.open{display:block;}
  .raise-panel input[type=range]{width:100%; accent-color:var(--brass); margin:8px 0;}
  .raise-quick{display:flex; gap:6px; margin-bottom:6px;}
  .raise-quick button{flex:1; font-size:12px; padding:8px 6px; background:rgba(0,0,0,0.25); border:1px solid rgba(246,241,228,0.15); color:var(--cream); border-radius:8px;}
  .raise-quick button:hover{border-color:var(--brass); color:var(--brass);}
  .raise-amount{text-align:center; font-family:var(--font-display); font-size:22px; color:var(--brass); margin:2px 0;}
  .waiting-note{text-align:center; color:var(--muted-dim); font-size:13px; padding:8px 0;}

  /* ---------- Lobby-in-room ---------- */
  .lobby-panel{max-width:480px; margin:0 auto; padding:20px 16px 40px; flex:1; width:100%;}
  .players-list{margin-top:16px; display:flex; flex-direction:column; gap:8px;}
  .player-row{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(0,0,0,0.2); border:1px solid var(--panel-line); border-radius:10px; padding:10px 14px;
  }
  .player-row .pname{font-size:14px; font-weight:600;}
  .player-row .pchips{font-size:13px; color:var(--brass);}
  .player-row .ptag{font-size:11px; color:var(--muted-dim);}
  .lobby-hint{font-size:13px; color:var(--muted); line-height:1.6; margin-top:18px; text-align:center;}
  .config-summary{
    display:flex; gap:16px; justify-content:center; margin-top:14px; font-size:12px; color:var(--muted);
    flex-wrap:wrap;
  }
  .config-summary b{color:var(--cream); display:block; font-size:14px; font-family:var(--font-display);}

  /* ---------- Showdown / result banner ---------- */
  .result-banner{
    position:absolute; left:50%; bottom:6%; transform:translateX(-50%);
    background:rgba(9,22,17,0.95); border:1px solid var(--brass); border-radius:14px;
    padding:14px 20px; text-align:center; max-width:92%; box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  .result-banner .title{font-family:var(--font-display); font-size:19px; color:var(--brass); margin-bottom:4px;}
  .result-banner .sub{font-size:12px; color:var(--muted);}
  .showdown-hands{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px;}
  .sd-hand{text-align:center;}
  .sd-hand .cards{display:flex; gap:3px; justify-content:center;}
  .sd-hand .lbl{font-size:10px; color:var(--muted); margin-top:3px;}

  /* ---------- Log ---------- */
  .log-panel{
    position:fixed; right:0; top:0; bottom:0; width:280px; max-width:82vw;
    background:rgba(6,16,12,0.97); border-left:1px solid var(--panel-line);
    transform:translateX(100%); transition:transform 0.25s ease; z-index:50;
    display:flex; flex-direction:column;
  }
  .log-panel.open{transform:translateX(0);}
  .log-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--panel-line);}
  .log-head h3{margin:0; font-family:var(--font-display); font-size:17px; font-weight:600;}
  .log-list{flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:8px;}
  .log-item{font-size:12.5px; color:var(--muted); line-height:1.4; border-bottom:1px dashed rgba(255,255,255,0.06); padding-bottom:8px;}
  .log-scrim{position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:40; display:none;}
  .log-scrim.open{display:block;}

  .toast{
    position:fixed; left:50%; top:16px; transform:translateX(-50%);
    background:rgba(20,20,16,0.95); border:1px solid var(--brass); color:var(--cream);
    padding:10px 18px; border-radius:10px; font-size:13px; z-index:100; opacity:0; pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease; max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(4px);}

  @media (max-width:480px){
    .seat{width:96px; margin-left:-48px;}
    .card{width:32px; height:46px; font-size:13px;}
    .card.small{width:26px; height:37px; font-size:11px;}
  }

  /* ---------- Casino polish: chips, motion, glow ---------- */
  .chip-icon{
    display:inline-block; width:13px; height:13px; border-radius:50%; margin-right:5px; vertical-align:middle;
    background:repeating-conic-gradient(var(--brass) 0deg 30deg, #7c631f 30deg 60deg);
    box-shadow:0 1px 2px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(0,0,0,0.3);
    position:relative; top:-1px;
  }
  .card.back{
    background-image:
      repeating-linear-gradient(135deg, #3a2716, #3a2716 4px, #4a3320 4px, #4a3320 8px);
    position:relative;
  }
  .card.back::after{
    content:"◆"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:rgba(201,162,39,0.55); font-size:11px;
  }
  .card.small.back::after, .card.tiny.back::after{font-size:8px;}

  .community, .seat-hole, .my-hand-row .cards, .sd-hand .cards{ perspective:500px; }

  @keyframes cardDeal{
    from{ transform:translateY(-22px) scale(0.82) rotate(-8deg); opacity:0; }
    to{ transform:translateY(0) scale(1) rotate(0); opacity:1; }
  }
  .card.deal-in{ animation:cardDeal 0.4s cubic-bezier(.21,.85,.35,1) both; }

  @keyframes flipReveal{
    from{ transform:rotateY(80deg); opacity:0.15; }
    to{ transform:rotateY(0deg); opacity:1; }
  }
  .card.reveal-in{ animation:flipReveal 0.5s ease both; }

  @keyframes potPop{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.4); color:#fff2c2; }
    100%{ transform:scale(1); }
  }
  .pot-line b.pulse{ display:inline-block; animation:potPop 0.55s ease; }

  @keyframes turnGlow{
    0%,100%{ box-shadow:0 0 0 2px rgba(201,162,39,0.5), 0 0 14px rgba(201,162,39,0.3); }
    50%{ box-shadow:0 0 0 3px rgba(201,162,39,0.85), 0 0 26px rgba(201,162,39,0.55); }
  }
  .seat.turn .seat-plaque{ animation:turnGlow 1.6s ease-in-out infinite; }

  @keyframes betPulse{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.22); background:rgba(201,162,39,0.35); }
    100%{ transform:scale(1); }
  }
  .seat-bet.pulse{ animation:betPulse 0.5s ease; }

  @keyframes winGlow{
    0%,100%{ box-shadow:0 0 0 1px var(--brass), 0 0 0 rgba(201,162,39,0); }
    50%{ box-shadow:0 0 0 2px var(--brass), 0 0 30px rgba(201,162,39,0.7); }
  }
  .seat.winner .seat-plaque{ animation:winGlow 1.1s ease-in-out 3; }

  .chip-fly{
    position:absolute; width:13px; height:13px; margin-left:-7px; margin-top:-7px; border-radius:50%;
    background:repeating-conic-gradient(var(--brass) 0deg 30deg, var(--cream) 30deg 60deg);
    box-shadow:0 2px 5px rgba(0,0,0,0.55); z-index:26; pointer-events:none;
  }
  .chip-fly.to-pot{ animation:chipToPot 0.6s cubic-bezier(.3,.7,.4,1) forwards; }
  @keyframes chipToPot{
    0%{ left:var(--sx); top:var(--sy); opacity:1; transform:scale(1); }
    100%{ left:50%; top:50%; opacity:0; transform:scale(0.5); }
  }
  .chip-fly.to-seat{ animation:chipToSeat 0.7s cubic-bezier(.3,.7,.4,1) forwards; }
  @keyframes chipToSeat{
    0%{ left:50%; top:50%; opacity:1; transform:scale(1); }
    100%{ left:var(--sx); top:var(--sy); opacity:0; transform:scale(0.5); }
  }

  .result-banner{ animation:bannerIn 0.35s ease both; }
  @keyframes bannerIn{
    from{ opacity:0; transform:translateX(-50%) translateY(10px) scale(0.96); }
    to{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  }

  .sound-btn{ min-width:0; }

  .my-hand-row .card{ transition:transform 0.15s ease; }
  .my-hand-row .card:hover{ transform:translateY(-4px); }

  @media (prefers-reduced-motion: reduce){
    .card.deal-in, .card.reveal-in, .seat.turn .seat-plaque, .seat-bet.pulse,
    .seat.winner .seat-plaque, .chip-fly, .result-banner, .pot-line b.pulse{
      animation:none !important;
    }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   ENGINE — cards, hand evaluation, game state transitions (pure logic)
   ========================================================================= */
const RANKS = ['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
const SUITS = ['s','h','d','c'];
const SUIT_SYMBOL = {s:'♠', h:'♥', d:'♦', c:'♣'};
const CAT_LABEL = ['Өндөр хаалт','Хос','Хоёр хос','Гурвал','Стрит','Флош','Фулл хаус','Каре','Стрит флош'];

function createDeck(){ const d=[]; for(const s of SUITS) for(const r of RANKS) d.push(r+s); return d; }
function shuffleDeck(deck){ const d=deck.slice(); for(let i=d.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [d[i],d[j]]=[d[j],d[i]]; } return d; }
function cardRank(c){ return RANKS.indexOf(c[0])+2; }
function cardSuit(c){ return c[1]; }

function evaluate5(cards){
  const ranks = cards.map(cardRank).sort((a,b)=>b-a);
  const suits = cards.map(cardSuit);
  const isFlush = suits.every(s=>s===suits[0]);
  const counts = {};
  ranks.forEach(r=> counts[r]=(counts[r]||0)+1);
  const groups = Object.entries(counts).map(([r,c])=>({r:+r,c})).sort((a,b)=>(b.c-a.c)||(b.r-a.r));
  const uniq = [...new Set(ranks)];
  let straightHigh = null;
  if(uniq.length===5){
    if(uniq[0]-uniq[4]===4) straightHigh=uniq[0];
    else if(uniq.join(',')==='14,5,4,3,2') straightHigh=5;
  }
  const isStraight = straightHigh!==null;
  function score(cat,tie){ let s=cat; for(let i=0;i<5;i++) s = s*15+(tie[i]||0); return s; }
  function label(cat){ if(cat===8 && straightHigh===14) return 'Роял флош'; return CAT_LABEL[cat]; }
  if(isStraight && isFlush) return {score:score(8,[straightHigh]),cat:8,label:label(8)};
  if(groups[0].c===4) return {score:score(7,[groups[0].r,groups[1].r]),cat:7,label:label(7)};
  if(groups[0].c===3 && groups[1] && groups[1].c>=2) return {score:score(6,[groups[0].r,groups[1].r]),cat:6,label:label(6)};
  if(isFlush) return {score:score(5,ranks),cat:5,label:label(5)};
  if(isStraight) return {score:score(4,[straightHigh]),cat:4,label:label(4)};
  if(groups[0].c===3){ const kick=groups.filter(g=>g.c===1).map(g=>g.r); return {score:score(3,[groups[0].r,...kick]),cat:3,label:label(3)}; }
  if(groups[0].c===2 && groups[1] && groups[1].c===2){ const kick=groups.find(g=>g.c===1).r; return {score:score(2,[groups[0].r,groups[1].r,kick]),cat:2,label:label(2)}; }
  if(groups[0].c===2){ const kick=groups.filter(g=>g.c===1).map(g=>g.r); return {score:score(1,[groups[0].r,...kick]),cat:1,label:label(1)}; }
  return {score:score(0,ranks),cat:0,label:label(0)};
}
function evaluate7(cards7){
  let best=null; const n=cards7.length;
  for(let a=0;a<n;a++) for(let b=a+1;b<n;b++) for(let c=b+1;c<n;c++) for(let d=c+1;d<n;d++) for(let e=d+1;e<n;e++){
    const hand=[cards7[a],cards7[b],cards7[c],cards7[d],cards7[e]];
    const res=evaluate5(hand);
    if(!best || res.score>best.score) best={...res, cards:hand};
  }
  return best;
}

function newPlayerObj(identity, seat, chips){
  return {id:identity.id, name:identity.name, seat, chips, folded:false, inHand:false, hole:[], betThisRound:0, totalBetThisHand:0, left:false};
}
function addLog(state,msg){ state.log=state.log||[]; state.log.push(msg); if(state.log.length>40) state.log.shift(); }
function postBlind(state, seat, amount){
  const p = state.players.find(pp=>pp.seat===seat);
  const pay = Math.min(amount, p.chips);
  p.chips-=pay; p.betThisRound+=pay; p.totalBetThisHand+=pay; state.pot+=pay;
  addLog(state, `${p.name} ${pay} блайнд тавив${p.chips===0?' (Ол-ин)':''}`);
}
function buildActOrder(state, seats, firstSeat){
  const idx = seats.indexOf(firstSeat);
  const rotated = [...seats.slice(idx), ...seats.slice(0,idx)];
  return rotated.filter(s=>{ const p=state.players.find(pp=>pp.seat===s); return p.chips>0 && !p.folded; });
}
function startHand(state){
  const eligible = state.players.filter(p=>!p.left && p.chips>0);
  if(eligible.length<2) return 'Тоглоход дор хаяж 2 тоглогч (мөнгөтэй) хэрэгтэй';
  state.players.forEach(p=>{ p.inHand = eligible.includes(p); });
  const seats = eligible.map(p=>p.seat).sort((a,b)=>a-b);
  let dealerSeat = state.dealerSeat;
  if(dealerSeat===null || dealerSeat===undefined || !seats.includes(dealerSeat)){ dealerSeat=seats[0]; }
  else { const idx=seats.indexOf(dealerSeat); dealerSeat=seats[(idx+1)%seats.length]; }
  state.dealerSeat=dealerSeat;
  state.deck = shuffleDeck(createDeck());
  state.community=[]; state.pot=0; state.result=null; state.log=[];
  state.players.forEach(p=>{ p.folded=false; p.hole=[]; p.betThisRound=0; p.totalBetThisHand=0; });
  const idxD = seats.indexOf(dealerSeat);
  const dealOrder = [...seats.slice(idxD+1), ...seats.slice(0,idxD+1)];
  for(let round=0; round<2; round++){ for(const s of dealOrder){ const p=state.players.find(pp=>pp.seat===s); p.hole.push(state.deck.pop()); } }
  let sbSeat, bbSeat;
  if(seats.length===2){ sbSeat=dealerSeat; bbSeat=seats.find(s=>s!==dealerSeat); }
  else { const idx=seats.indexOf(dealerSeat); sbSeat=seats[(idx+1)%seats.length]; bbSeat=seats[(idx+2)%seats.length]; }
  state.sbSeat=sbSeat; state.bbSeat=bbSeat;
  postBlind(state, sbSeat, state.smallBlind);
  postBlind(state, bbSeat, state.bigBlind);
  state.currentBet=state.bigBlind; state.minRaise=state.bigBlind;
  let firstSeat;
  if(seats.length===2){ firstSeat=dealerSeat; }
  else { const idxBB=seats.indexOf(bbSeat); firstSeat=seats[(idxBB+1)%seats.length]; }
  state.toActSeats = buildActOrder(state, seats, firstSeat);
  state.turnSeat = state.toActSeats[0] ?? null;
  state.stage='preflop';
  state.handNumber=(state.handNumber||0)+1;
  addLog(state, `Гар #${state.handNumber} эхэллээ`);
  return true;
}
function reopenAction(state, raiserSeat){
  const seats = state.players.filter(p=>p.inHand).map(p=>p.seat).sort((a,b)=>a-b);
  const idx = seats.indexOf(raiserSeat);
  const rotated = [...seats.slice(idx+1), ...seats.slice(0,idx+1)];
  state.toActSeats = rotated.filter(s=>s!==raiserSeat).filter(s=>{ const p=state.players.find(pp=>pp.seat===s); return !p.folded && p.chips>0; });
}
function dealCommunity(state,n){ for(let i=0;i<n;i++) state.community.push(state.deck.pop()); }
function awardUncontested(state, winner){
  winner.chips += state.pot;
  addLog(state, `${winner.name} ${state.pot} чипийг авлаа (бусад бүгд фолдлоо)`);
  state.result = {type:'uncontested', winnerSeat:winner.seat, amount:state.pot};
  state.pot=0; state.stage='handover'; state.turnSeat=null; state.toActSeats=[];
}
function doShowdown(state){
  const contenders = state.players.filter(p=>p.inHand && !p.folded);
  const evals = contenders.map(p=>{ const best=evaluate7([...p.hole, ...state.community]); return {seat:p.seat, name:p.name, hole:p.hole, ...best}; });
  const contributors = state.players.filter(p=>p.inHand).map(p=>({seat:p.seat, amt:p.totalBetThisHand, folded:p.folded}));
  const levels = [...new Set(contributors.map(c=>c.amt))].sort((a,b)=>a-b);
  let prevLevel=0; const pots=[];
  for(const lvl of levels){
    if(lvl===prevLevel) continue;
    const contributingCount = contributors.filter(c=>c.amt>=lvl).length;
    const layerAmount = (lvl-prevLevel)*contributingCount;
    if(layerAmount>0){
      const eligibleSeats = contributors.filter(c=>c.amt>=lvl && !c.folded).map(c=>c.seat);
      pots.push({amount:layerAmount, eligibleSeats});
    }
    prevLevel=lvl;
  }
  const potsAwarded=[];
  for(const pot of pots){
    const evalsInPot = evals.filter(e=>pot.eligibleSeats.includes(e.seat));
    if(evalsInPot.length===0) continue;
    const maxScore = Math.max(...evalsInPot.map(e=>e.score));
    const winners = evalsInPot.filter(e=>e.score===maxScore);
    const share = Math.floor(pot.amount/winners.length);
    let remainder = pot.amount - share*winners.length;
    winners.forEach((w,i)=>{ const p=state.players.find(pp=>pp.seat===w.seat); let amt=share; if(i<remainder) amt+=1; p.chips+=amt; });
    potsAwarded.push({seats:winners.map(w=>w.seat), amount:pot.amount, label:winners[0].label});
  }
  state.pot=0;
  state.result = {type:'showdown', evals, potsAwarded};
  state.stage='handover'; state.turnSeat=null; state.toActSeats=[];
  addLog(state, 'Шоудаун!');
}
function advanceStage(state){
  state.players.forEach(p=>{ if(p.inHand) p.betThisRound=0; });
  state.currentBet=0; state.minRaise=state.bigBlind;
  if(state.stage==='preflop'){ dealCommunity(state,3); state.stage='flop'; }
  else if(state.stage==='flop'){ dealCommunity(state,1); state.stage='turn'; }
  else if(state.stage==='turn'){ dealCommunity(state,1); state.stage='river'; }
  else if(state.stage==='river'){ doShowdown(state); return; }
  addLog(state, state.stage==='flop'?'Флоп нээгдлээ':state.stage==='turn'?'Тёрн нээгдлээ':'Ривер нээгдлээ');
  const allSeats = state.players.filter(p=>p.inHand).map(p=>p.seat).sort((a,b)=>a-b);
  const canAct = allSeats.filter(s=>{ const p=state.players.find(pp=>pp.seat===s); return !p.folded && p.chips>0; });
  if(canAct.length<=1){ advanceStage(state); return; }
  const idx = allSeats.indexOf(state.dealerSeat);
  const rotated = [...allSeats.slice(idx+1), ...allSeats.slice(0,idx+1)];
  state.toActSeats = rotated.filter(s=>{ const p=state.players.find(pp=>pp.seat===s); return !p.folded && p.chips>0; });
  state.turnSeat = state.toActSeats[0] ?? null;
}
function applyAction(state, seat, action, amount){
  if(state.turnSeat!==seat) return 'Одоо чиний ээлж биш';
  const p = state.players.find(pp=>pp.seat===seat);
  if(!p || p.folded || !p.inHand) return 'Буруу тоглогч';
  const toCall = state.currentBet - p.betThisRound;
  if(action==='fold'){ p.folded=true; addLog(state, `${p.name} фолд хийлээ`); }
  else if(action==='check'){ if(toCall>0) return 'Чек хийх боломжгүй'; addLog(state, `${p.name} чек хийлээ`); }
  else if(action==='call'){
    const pay=Math.min(toCall,p.chips);
    p.chips-=pay; p.betThisRound+=pay; p.totalBetThisHand+=pay; state.pot+=pay;
    addLog(state, `${p.name} ${pay} дуудлаа${p.chips===0?' (Ол-ин)':''}`);
  } else if(action==='raise'){
    const target = Math.min(amount, p.betThisRound+p.chips);
    const pay = target - p.betThisRound;
    if(pay<=0) return 'Буруу хэмжээ';
    const isAllIn = pay===p.chips;
    if(!isAllIn && target < state.currentBet+state.minRaise) return `Дор хаяж ${state.currentBet+state.minRaise} хүртэл өсгөх ёстой`;
    p.chips-=pay; p.betThisRound=target; p.totalBetThisHand+=pay; state.pot+=pay;
    const raiseAmt = target-state.currentBet;
    if(target>state.currentBet){
      if(raiseAmt>=state.minRaise) state.minRaise=raiseAmt;
      state.currentBet=target;
      reopenAction(state, seat);
      addLog(state, `${p.name} ${target} хүртэл ${isAllIn?'ол-ин хийв':'өсгөлөө'}`);
      const remaining = state.players.filter(pp=>pp.inHand && !pp.folded);
      if(remaining.length===1){ awardUncontested(state, remaining[0]); return true; }
      state.turnSeat = state.toActSeats[0] ?? null;
      if(state.toActSeats.length===0) advanceStage(state);
      return true;
    } else {
      addLog(state, `${p.name} ${target} хүртэл ол-ин хийв (дуудлагатай тэнцүү)`);
    }
  } else return 'Мэдэгдэхгүй үйлдэл';
  state.toActSeats = state.toActSeats.filter(s=>s!==seat);
  const remaining = state.players.filter(pp=>pp.inHand && !pp.folded);
  if(remaining.length===1){ awardUncontested(state, remaining[0]); return true; }
  if(state.toActSeats.length===0) advanceStage(state); else state.turnSeat=state.toActSeats[0];
  return true;
}

async function loadRoom(code){
  if(!fbDb) return null;
  try{ const snap = await fbDb.ref('poker_rooms/'+code).get(); return snap.exists() ? snap.val() : null; }
  catch(e){ console.error('loadRoom failed', e); return null; }
}
async function saveRoom(code, state){
  if(!fbDb) return false;
  try{ await fbDb.ref('poker_rooms/'+code).set(state); return true; }
  catch(e){ console.error('saveRoom failed', e); return false; }
}
// Safely add/reactivate a player under concurrent joins: reads, modifies and
// writes the whole room as one atomic step so two friends joining at the same
// instant never get assigned the same seat.
async function joinRoomTransaction(code, mutateFn){
  if(!fbDb) return { committed:false, state:null };
  try{
    const res = await fbDb.ref('poker_rooms/'+code).transaction(current=>{
      if(current===null) return current; // room doesn't exist -> abort, unchanged
      return mutateFn(current) || current;
    });
    return { committed: res.committed, state: res.snapshot ? res.snapshot.val() : null };
  }catch(e){ console.error('joinRoomTransaction failed', e); return { committed:false, state:null }; }
}

/* ---- Sound: tiny synthesised casino blips via Web Audio, no external files ---- */
let audioCtx = null;
function ensureAudio(){
  if(audioCtx) return;
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function beep(freq, dur, type, vol){
  if(!App.soundOn) return;
  ensureAudio();
  if(!audioCtx) return;
  try{
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type||'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol||0.05, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur);
  }catch(e){}
}
function sndDeal(){ beep(540,0.07,'triangle',0.035); }
function sndChip(){ beep(760,0.05,'square',0.028); }
function sndWin(){ beep(660,0.11,'sine',0.045); setTimeout(()=>beep(880,0.14,'sine',0.045),90); setTimeout(()=>beep(1040,0.18,'sine',0.045),190); }

/* ---- Animation diff: compare previous room snapshot to new one ---- */
function computeAnimMeta(prevRoom, newRoom){
  const prev = prevRoom || {};
  const meta = { newHand:false, newCommunityFrom:0, potIncreased:false, justFinished:false, betIncreasedSeats:[] };
  meta.newHand = (newRoom.handNumber||0) !== (prev.handNumber||0);
  meta.newCommunityFrom = (prev.handNumber===newRoom.handNumber) ? (prev.community||[]).length : 0;
  meta.potIncreased = (newRoom.pot||0) > (prev.pot||0);
  meta.justFinished = newRoom.stage==='handover' && prev.stage!=='handover';
  const prevBets = {}; (prev.players||[]).forEach(p=> prevBets[p.seat]=p.betThisRound||0);
  meta.betIncreasedSeats = (newRoom.players||[]).filter(p=> (p.betThisRound||0) > (prevBets[p.seat]||0)).map(p=>p.seat);
  return meta;
}

/* Central place every room-state update flows through: computes animation/sound
   diffs against the previous snapshot, then re-renders. */
function applyNewRoomState(newState){
  const meta = computeAnimMeta(App.room, newState);
  App.animMeta = meta;
  App.room = newState;
  if(meta.newHand) sndDeal();
  else if(meta.betIncreasedSeats.length) sndChip();
  if(meta.justFinished) sndWin();
  render();
}

function seatPositions(n){
  const pos=[];
  for(let k=0;k<n;k++){
    const theta = Math.PI/2 + k*(2*Math.PI/n);
    const left = 50 + 44*Math.cos(theta);
    const top = 50 + 40*Math.sin(theta);
    pos.push({left, top});
  }
  return pos;
}

function renderTable(state, me){
  const meta = App.animMeta || {newHand:false, newCommunityFrom:0, potIncreased:false, justFinished:false, betIncreasedSeats:[]};
  const activePlayers = state.players.filter(p=>!p.left);
  const n = activePlayers.length;

  // order seats starting from "me" at the bottom for intuitive layout
  let ordered = activePlayers.slice().sort((a,b)=>a.seat-b.seat);
  if(me){
    const idx = ordered.findIndex(p=>p.id===me.id);
    if(idx>0) ordered = [...ordered.slice(idx), ...ordered.slice(0,idx)];
  }
  const positions = seatPositions(n);
  const seatPos = {};
  ordered.forEach((p,i)=> seatPos[p.seat] = positions[i]);

  // winner seats for glow / chip-shower, only meaningful right at the moment a hand finishes
  let winnerSeats = [];
  if(meta.justFinished && state.result){
    if(state.result.type==='uncontested') winnerSeats = [state.result.winnerSeat];
    else if(state.result.potsAwarded) winnerSeats = [...new Set(state.result.potsAwarded.flatMap(pa=>pa.seats))];
  }

  const seatHTML = ordered.map((p,i)=>{
    const pos = positions[i];
    const isTurn = state.turnSeat===p.seat && state.stage!=='handover' && state.stage!=='lobby';
    const isMe = me && p.id===me.id;
    const showdownEval = state.result && state.result.type==='showdown' && state.result.evals && state.result.evals.find(e=>e.seat===p.seat);
    const showCards = isMe || showdownEval;
    let holeHTML='';
    if(p.inHand && !p.folded && p.hole && p.hole.length===2){
      const dealDelay0 = meta.newHand ? i*90 : 0;
      const dealDelay1 = meta.newHand ? i*90+40 : 0;
      if(showCards){
        const revealed = isMe ? p.hole : showdownEval.hole;
        const isFreshReveal = !isMe && meta.justFinished;
        const cls = meta.newHand ? 'deal-in' : (isFreshReveal ? 'reveal-in' : '');
        holeHTML = `<div class="seat-hole">${cardHTML(revealed[0],{size:'tiny', extraClass:cls, delay:meta.newHand?dealDelay0:0})}${cardHTML(revealed[1],{size:'tiny', extraClass:cls, delay:meta.newHand?dealDelay1:0})}</div>`;
      } else {
        const cls = meta.newHand ? 'deal-in' : '';
        holeHTML = `<div class="seat-hole">${cardHTML(null,{size:'tiny', extraClass:cls, delay:dealDelay0})}${cardHTML(null,{size:'tiny', extraClass:cls, delay:dealDelay1})}</div>`;
      }
    }
    const tags=[];
    if(state.dealerSeat===p.seat) tags.push('D');
    const cls=['seat'];
    if(isMe) cls.push('me');
    if(isTurn) cls.push('turn');
    if(p.folded && p.inHand) cls.push('folded');
    if(winnerSeats.includes(p.seat)) cls.push('winner');
    const betCls = meta.betIncreasedSeats.includes(p.seat) ? ' pulse' : '';
    return `
    <div class="${cls.join(' ')}" style="left:${pos.left}%; top:${pos.top}%;">
      <div class="seat-plaque">
        ${tags.length? `<div class="seat-tag">${tags.join(' ')}</div>`:''}
        <div class="seat-name">${esc(p.name)}${isMe?' (та)':''}</div>
        <div class="seat-chips"><span class="chip-icon"></span>${p.chips}</div>
        ${holeHTML}
        ${p.betThisRound>0 ? `<div class="seat-bet${betCls}">${p.betThisRound}</div>` : ''}
        ${p.folded && p.inHand ? `<div class="seat-bet">фолд</div>` : ''}
      </div>
    </div>`;
  }).join('');

  // chips flying from a seat into the pot, for whoever's bet just increased
  const chipFlyToPot = meta.betIncreasedSeats.map(seat=>{
    const pos = seatPos[seat]; if(!pos) return '';
    return `<div class="chip-fly to-pot" style="--sx:${pos.left}%; --sy:${pos.top}%;"></div>`;
  }).join('');

  // a little chip shower from the pot toward whoever just won, right as the hand ends
  const chipFlyToWinner = winnerSeats.flatMap(seat=>{
    const pos = seatPos[seat]; if(!pos) return [];
    return [0,90,170].map(delay=> `<div class="chip-fly to-seat" style="--sx:${pos.left}%; --sy:${pos.top}%; animation-delay:${delay}ms;"></div>`);
  }).join('');

  const communityHTML = (state.community && state.community.length)
    ? state.community.map((c,i)=>{
        const isNew = i>=meta.newCommunityFrom;
        return cardHTML(c, isNew? {extraClass:'deal-in', delay:(i-meta.newCommunityFrom)*100} : {});
      }).join('')
    : '<div style="color:var(--muted-dim); font-size:12px;">Тоглоом бэлдэж байна…</div>';

  const stageLabel = {preflop:'Префлоп', flop:'Флоп', turn:'Тёрн', river:'Ривер', handover:'Гар дууслаа'}[state.stage] || '';

  let resultBanner = '';
  if(state.stage==='handover' && state.result){
    if(state.result.type==='uncontested'){
      const w = state.players.find(p=>p.seat===state.result.winnerSeat);
      resultBanner = `
      <div class="result-banner">
        <div class="title">${esc(w?w.name:'')} ялав</div>
        <div class="sub"><span class="chip-icon"></span>${state.result.amount} чип авлаа — бусад бүгд фолдлоо</div>
      </div>`;
    } else {
      const hands = state.result.evals.map(e=>`
        <div class="sd-hand">
          <div class="cards">${cardHTML(e.hole[0],{size:'small'})}${cardHTML(e.hole[1],{size:'small'})}</div>
          <div class="lbl">${esc(e.name)} · ${e.label}</div>
        </div>`).join('');
      const potLines = state.result.potsAwarded.map(pa=>{
        const names = pa.seats.map(s=>{ const p=state.players.find(pp=>pp.seat===s); return p?p.name:''; }).join(', ');
        return `${esc(names)} — ${pa.amount} чип (${pa.label})`;
      }).join(' · ');
      resultBanner = `
      <div class="result-banner">
        <div class="title">Шоудаун</div>
        <div class="sub">${potLines}</div>
        <div class="showdown-hands">${hands}</div>
      </div>`;
    }
  }

  const actionBar = renderActionBar(state, me);

  return `
  <div class="room-header">
    <div class="code-chip">Код: <b>${state.code}</b> <button id="copyCodeBtn">хуулах</button></div>
    <div class="hdr-actions">
      <button class="icon-btn sound-btn" id="soundBtn">${App.soundOn?'Дуу: асаалттай':'Дуу: хаалттай'}</button>
      <button class="icon-btn" id="logBtn">Түүх</button>
      <button class="icon-btn" id="leaveBtn">Гарах</button>
    </div>
  </div>
  <div class="table-wrap">
    <div class="table-oval-holder">
      <div class="table-oval">
        <div class="table-center">
          <div class="community">${communityHTML}</div>
          <div class="pot-line"><span class="chip-icon"></span>Сан: <b class="${meta.potIncreased?'pulse':''}">${state.pot}</b></div>
          <div class="stage-line">${stageLabel}${state.handNumber?` · Гар #${state.handNumber}`:''}</div>
        </div>
      </div>
      ${seatHTML}
      ${chipFlyToPot}
      ${chipFlyToWinner}
      ${resultBanner}
    </div>
  </div>
  ${actionBar}
  <div class="log-scrim ${App.logOpen?'open':''}" id="logScrim"></div>
  <div class="log-panel ${App.logOpen?'open':''}" id="logPanel">
    <div class="log-head"><h3>Түүх</h3><button class="icon-btn" id="logCloseBtn">Хаах</button></div>
    <div class="log-list">${(state.log||[]).slice().reverse().map(l=>`<div class="log-item">${esc(l)}</div>`).join('') || '<div class="log-item">Одоогоор хоосон</div>'}</div>
  </div>`;
}

function renderActionBar(state, me){
  if(!me || me.left){
    return `<div class="action-bar"><div class="waiting-note">Та ажиглагч байна.</div></div>`;
  }
  if(state.stage==='handover'){
    return `<div class="action-bar">
      <button class="btn btn-primary btn-block" id="nextHandBtn">Дараагийн гар</button>
      ${me.chips===0? `<button class="btn btn-ghost btn-block" id="rebuyBtn" style="margin-top:8px;">Чип дахин цэнэглэх (${state.startingChips})</button>` : ''}
    </div>`;
  }
  const meta = App.animMeta || {newHand:false};
  if(!me.inHand || me.folded){
    const myHoleHTML = (me.hole && me.hole.length===2) ? me.hole.map(c=>cardHTML(c)).join('') : `${cardHTML(null)}${cardHTML(null)}`;
    return `<div class="action-bar">
      <div class="my-hand-row">
        <div class="cards">${myHoleHTML}</div>
        <div class="my-hand-info"><b><span class="chip-icon"></span>${me.chips} чип</b>${me.folded?'Та фолд хийсэн — гар дуусахыг хүлээнэ үү':'Дараагийн гарыг хүлээж байна'}</div>
      </div>
      <div class="waiting-note">Ээлж хүлээж байна…</div>
    </div>`;
  }
  const isMyTurn = state.turnSeat===me.seat;
  const toCall = state.currentBet - me.betThisRound;
  const myHoleHTML = me.hole.map((c,i)=>cardHTML(c, meta.newHand? {extraClass:'deal-in', delay:i*100}: {})).join('');
  const minRaiseTarget = Math.min(state.currentBet + state.minRaise, me.betThisRound + me.chips);
  const maxRaiseTarget = me.betThisRound + me.chips;

  if(App.raiseValue < minRaiseTarget || App.raiseValue > maxRaiseTarget) App.raiseValue = minRaiseTarget;

  let controls = '';
  if(!isMyTurn){
    controls = `<div class="waiting-note">Бусдын ээлж байна…</div>`;
  } else {
    controls = `
    <div class="actions-row">
      <button class="btn btn-danger" id="foldBtn">Фолд</button>
      ${toCall>0
        ? `<button class="btn btn-ghost" id="callBtn">Дуудах (${Math.min(toCall,me.chips)})</button>`
        : `<button class="btn btn-ghost" id="checkBtn">Чек</button>`}
      ${me.chips>0 ? `<button class="btn btn-primary" id="raiseToggleBtn">${toCall>0?'Өсгөх':'Бет тавих'}</button>` : ''}
    </div>
    <div class="raise-panel ${App.raiseOpen?'open':''}" id="raisePanel">
      <div class="raise-amount" id="raiseAmountLabel">${App.raiseValue}</div>
      <input type="range" id="raiseSlider" min="${minRaiseTarget}" max="${maxRaiseTarget}" step="${Math.max(1, Math.floor(state.bigBlind/2))}" value="${App.raiseValue}">
      <div class="raise-quick">
        <button data-amt="${minRaiseTarget}">Бага</button>
        <button data-amt="${Math.min(maxRaiseTarget, Math.round((state.pot+toCall)*0.5)+state.currentBet)}">1/2 сан</button>
        <button data-amt="${Math.min(maxRaiseTarget, state.pot+toCall+state.currentBet)}">Сан</button>
        <button data-amt="${maxRaiseTarget}">Ол-ин</button>
      </div>
      <button class="btn btn-primary btn-block" id="confirmRaiseBtn">${App.raiseValue>=maxRaiseTarget?'Ол-ин хийх':'Баталгаажуулах'} — ${App.raiseValue}</button>
    </div>`;
  }

  return `<div class="action-bar">
    <div class="my-hand-row">
      <div class="cards">${myHoleHTML}</div>
      <div class="my-hand-info"><b><span class="chip-icon"></span>${me.chips} чип</b>${isMyTurn?'Таны ээлж':'Хүлээж байна'}</div>
    </div>
    ${controls}
  </div>`;
}

/* =========================================================================
   EVENTS
   ========================================================================= */
function wireEvents(){
  const $ = id => document.getElementById(id);

  if(App.screen==='landing'){
    $('nameInput') && $('nameInput').addEventListener('input', e=> App.myIdentity.name = e.target.value);
    $('advToggle') && $('advToggle').addEventListener('click', ()=>{ App.advOpen=!App.advOpen; render(); });
    $('createBtn') && $('createBtn').addEventListener('click', onCreateRoom);
    $('joinBtn') && $('joinBtn').addEventListener('click', onJoinRoom);
    $('codeInput') && $('codeInput').addEventListener('keydown', e=>{ if(e.key==='Enter') onJoinRoom(); });
    $('nameInput') && $('nameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') onCreateRoom(); });
    return;
  }

  $('copyCodeBtn') && $('copyCodeBtn').addEventListener('click', ()=>{
    const code = App.roomCode;
    try{ navigator.clipboard.writeText(code); showToast('Код хуулагдлаа: '+code); }
    catch(e){ showToast('Код: '+code); }
  });
  $('leaveBtn') && $('leaveBtn').addEventListener('click', onLeaveRoom);
  $('soundBtn') && $('soundBtn').addEventListener('click', ()=>{ App.soundOn=!App.soundOn; ensureAudio(); if(App.soundOn) beep(700,0.05,'sine',0.03); render(); });
  $('logBtn') && $('logBtn').addEventListener('click', ()=>{ App.logOpen=true; render(); });
  $('logCloseBtn') && $('logCloseBtn').addEventListener('click', ()=>{ App.logOpen=false; render(); });
  $('logScrim') && $('logScrim').addEventListener('click', ()=>{ App.logOpen=false; render(); });

  $('startBtn') && $('startBtn').addEventListener('click', onStartHand);
  $('nextHandBtn') && $('nextHandBtn').addEventListener('click', onStartHand);
  $('rebuyBtn') && $('rebuyBtn').addEventListener('click', onRebuy);

  $('foldBtn') && $('foldBtn').addEventListener('click', ()=>onAction('fold'));
  $('checkBtn') && $('checkBtn').addEventListener('click', ()=>onAction('check'));
  $('callBtn') && $('callBtn').addEventListener('click', ()=>onAction('call'));
  $('raiseToggleBtn') && $('raiseToggleBtn').addEventListener('click', ()=>{ App.raiseOpen=!App.raiseOpen; render(); });
  $('raiseSlider') && $('raiseSlider').addEventListener('input', e=>{ App.raiseValue=+e.target.value; $('raiseAmountLabel').textContent=App.raiseValue; $('confirmRaiseBtn').textContent = (App.raiseValue>=+e.target.max?'Ол-ин хийх':'Баталгаажуулах')+' — '+App.raiseValue; });
  $('confirmRaiseBtn') && $('confirmRaiseBtn').addEventListener('click', ()=>onAction('raise', App.raiseValue));
  document.querySelectorAll && document.querySelectorAll('.raise-quick button').forEach(btn=>{
    btn.addEventListener('click', ()=>{ App.raiseValue = Math.max(0, +btn.dataset.amt||0); render(); });
  });
}

async function onCreateRoom(){
  const nameInput = document.getElementById('nameInput');
  const name = (nameInput?.value || '').trim();
  if(!name){ App.error='Нэрээ оруулна уу'; render(); return; }
  const startChips = Math.max(100, +(document.getElementById('startChipsInput')?.value) || 1000);
  const smallBlind = Math.max(5, +(document.getElementById('smallBlindInput')?.value) || 10);
  App.myIdentity.name = name;
  await saveIdentity(App.myIdentity);
  const code = randCode();
  const state = {
    code, createdAt:Date.now(),
    startingChips: startChips, smallBlind, bigBlind: smallBlind*2,
    players:[ newPlayerObj(App.myIdentity, 0, startChips) ],
    nextSeat:1,
    stage:'lobby', dealerSeat:null, community:[], deck:[], pot:0, currentBet:0, minRaise:0,
    turnSeat:null, toActSeats:[], log:[], result:null, handNumber:0,
  };
  const ok = await saveRoom(code, state);
  if(!ok){ App.error='Ширээ үүсгэхэд алдаа гарлаа. Дахин оролдоно уу.'; render(); return; }
  App.error=''; App.roomCode=code; App.screen='room';
  startPolling(code); applyNewRoomState(state);
}

async function onJoinRoom(){
  const nameInput = document.getElementById('nameInput');
  const codeInput = document.getElementById('codeInput');
  const name = (nameInput?.value || '').trim();
  const code = (codeInput?.value || '').trim().toUpperCase();
  if(!name){ App.error='Нэрээ оруулна уу'; render(); return; }
  if(!code){ App.error='Ширээний кодоо оруулна уу'; render(); return; }
  App.myIdentity.name = name;
  saveIdentity(App.myIdentity);
  const precheck = await loadRoom(code);
  if(!precheck){ App.error='Ийм кодтой ширээ олдсонгүй'; render(); return; }
  let full = false;
  const tx = await joinRoomTransaction(code, current=>{
    let existing = current.players.find(p=>p.id===App.myIdentity.id);
    if(!existing){
      if(current.players.filter(p=>!p.left).length>=8){ full=true; return; } // abort transaction
      const seat = current.nextSeat++;
      current.players.push(newPlayerObj(App.myIdentity, seat, current.startingChips));
    } else if(existing.left){
      existing.left=false;
      if(existing.chips<=0) existing.chips = current.startingChips;
    } else {
      existing.name = App.myIdentity.name;
    }
    return current;
  });
  if(!tx.committed){ App.error = full ? 'Ширээ дүүрсэн байна (8 хүн)' : 'Нэгдэхэд алдаа гарлаа. Дахин оролдоно уу.'; render(); return; }
  App.error=''; App.roomCode=code; App.screen='room';
  startPolling(code); applyNewRoomState(tx.state);
}

async function onLeaveRoom(){
  stopPolling();
  const code = App.roomCode;
  const state = await loadRoom(code);
  if(state){
    const p = state.players.find(pp=>pp.id===App.myIdentity.id);
    if(p){
      if(state.turnSeat===p.seat && (state.stage!=='lobby' && state.stage!=='handover')){
        applyAction(state, p.seat, 'fold');
      }
      p.left=true;
      await saveRoom(code, state);
    }
  }
  App.screen='landing'; App.room=null; App.roomCode=null; App.error='';
  render();
}

async function onStartHand(){
  const state = await loadRoom(App.roomCode);
  if(!state){ showToast('Ширээ олдсонгүй'); return; }
  const res = startHand(state);
  if(typeof res==='string'){ showToast(res); applyNewRoomState(state); return; }
  App.raiseOpen=false;
  const ok = await saveRoom(App.roomCode, state);
  if(!ok){ showToast('Хадгалахад алдаа гарлаа'); return; }
  applyNewRoomState(state);
}

async function onRebuy(){
  const state = await loadRoom(App.roomCode);
  if(!state) return;
  const p = state.players.find(pp=>pp.id===App.myIdentity.id);
  if(p && p.chips===0){ p.chips = state.startingChips; addLog(state, `${p.name} чипээ дахин цэнэглэлээ`); await saveRoom(App.roomCode, state); applyNewRoomState(state); }
}

async function onAction(action, amount){
  const fresh = await loadRoom(App.roomCode);
  if(!fresh){ showToast('Холболт алдагдлаа, дахин оролдоно уу'); return; }
  const me = fresh.players.find(p=>p.id===App.myIdentity.id);
  if(!me){ showToast('Та энэ ширээнд алга байна'); return; }
  const res = applyAction(fresh, me.seat, action, amount);
  if(typeof res==='string'){ showToast(res); applyNewRoomState(fresh); return; }
  App.raiseOpen=false;
  const ok = await saveRoom(App.roomCode, fresh);
  if(!ok){ showToast('Хадгалахад алдаа гарлаа'); return; }
  applyNewRoomState(fresh);
}

function randCode(len=4){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<len;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

/* =========================================================================
   POLLING
   ========================================================================= */
/* =========================================================================
   REALTIME SYNC — Firebase push updates instead of polling
   ========================================================================= */
let roomListenerRef = null;
function startPolling(code){
  stopPolling();
  if(!fbDb) return;
  roomListenerRef = fbDb.ref('poker_rooms/'+code);
  roomListenerRef.on('value', snap=>{
    const fresh = snap.val();
    if(fresh && JSON.stringify(fresh)!==JSON.stringify(App.room)){
      applyNewRoomState(fresh);
    }
  });
}
function stopPolling(){ if(roomListenerRef){ roomListenerRef.off(); roomListenerRef=null; } }

/* =========================================================================
   INIT
   ========================================================================= */
(async function init(){
  App.myIdentity = await loadIdentity();
  render();
})();
</script>
