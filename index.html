<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="KHAN POKER — найзуудтайгаа онлайн Texas Hold'em тоглоорой. Зөвхөн үнэгүй виртуал жетон, бодит мөнгөгүй."
    />
    <title>KHAN POKER</title>
    <!--
      GitHub Pages дээр deep-link (жишээ нь /lobby руу шууд орох) 404 өгдөгийг
      засах "spa-github-pages" загвар. 404.html query дотор кодолсон замыг
      React Router mount хийхээс өмнө энд буцаан задална.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          const decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
